# JoAmy Installer — Home-Assistant-Add-on.
# Koppelt dieses Home Assistant EINMAL per Kurz-Code an joamy.uk — danach wird
# jeder Kauf automatisch installiert: das Add-on pollt den JoAmy-Lizenz-Server,
# lädt neue/aktualisierte Baustein-Pakete als ZIP, sichert die alte Version nach
# /config/joamy_backup/<zeitstempel>/ und entpackt nach /config/custom_components/.
# Anschließend stößt es den Config-Flow der Integration an und startet (optional)
# Home Assistant neu. Der Kopplungscode steht im Log (Zeile "KOPPLUNGSCODE: …")
# und groß auf der Ingress-Seite des Add-ons.
name: JoAmy Installer
version: "0.1.10"
slug: joamy_installer
description: Verbindet dein Home Assistant mit joamy.uk — Käufe installieren sich von selbst
url: https://joamy.uk
arch:
  - amd64
  - aarch64
init: false
# Core-API (http://supervisor/core/api, Bearer SUPERVISOR_TOKEN) wird gebraucht
# für: HA-Version bei der Registrierung und den Config-Flow-Anstoß nach dem
# Entpacken. Der NEUSTART läuft dagegen über den Supervisor-Management-Endpunkt
# POST /core/restart (wie `ha core restart`) — der Service-Weg über den
# /core/api-Proxy blockiert bis zum Gateway-Timeout (504, HA 2026.x).
homeassistant_api: true
hassio_api: true
hassio_role: admin
# Ingress: die Status-Seite (Kopplungscode, Bausteine, Logs) läuft NUR über den
# authentifizierten Supervisor-Ingress-Proxy — der Port ist bewusst NICHT unter
# `ports:` veröffentlicht (nicht im LAN erreichbar). Die App lauscht auf
# 0.0.0.0:8321 und benutzt in der Seite ausschließlich RELATIVE Pfade, weil der
# Supervisor das Präfix /api/hassio_ingress/<token>/ davorschaltet.
ingress: true
ingress_port: 8321
# rw: die Pakete werden nach /config/custom_components/ entpackt und alte
# Versionen nach /config/joamy_backup/ gesichert.
map:
  - homeassistant_config:rw
options:
  server_url: "https://lizenz.joamy.uk"
  poll_sekunden: 60
  auto_neustart: true
schema:
  server_url: str
  poll_sekunden: int
  auto_neustart: bool
startup: services
boot: auto
